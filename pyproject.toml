[project]
name = "civilization-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# `uv sync` now produces an empty environment, so every install command must
# name an extra (all of them already do: Dockerfile `--extra serve`,
# Dockerfile.lambda `--extra api`, requirements.txt `.[serve]`, README's
# `--extra ingest` / `--all-extras`).
dependencies = []

[project.optional-dependencies]
pipeline = [
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.1",
    "langchain-openai>=1.1.14",
    "pinecone>=7.3.0",
    "pinecone-text>=0.11.0",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
]
serve-core = [
    "civilization-chatbot[pipeline]",
    "langgraph>=1.2.3",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
]
serve = ["streamlit>=1.56.0", "httpx>=0.28.1", "python-dotenv>=1.2.2"]
api = [
    "civilization-chatbot[serve-core]",
    "fastapi>=0.139.2",
    "langchain-aws>=1.6.3",
    "mangum>=0.21.0",
    "uvicorn[standard]>=0.51.0",
]
ingest = [
    "civilization-chatbot[pipeline]",
    "beautifulsoup4>=4.14.3",
    "langchain-community>=0.4.2",
    "requests>=2.33.1",
]
eval = ["civilization-chatbot[serve-core]", "anthropic>=0.96.0"]
mcp = ["civilization-chatbot[pipeline]", "mcp>=2.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.16"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.format]
docstring-code-format = true
