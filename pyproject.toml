[project]
name = "civilization-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Deliberately EMPTY. Everything moved into the `pipeline` extra below so the
# Streamlit frontend can be a genuinely thin client: a bare install pulls in
# nothing, and each surface asks for exactly the extra it needs. A bare
# `uv sync` now produces an empty environment, so every install command must
# name an extra (all of them already do: Dockerfile `--extra serve`,
# Dockerfile.lambda `--extra api`, requirements.txt `.[serve]`, README's
# `--extra ingest` / `--all-extras`).
dependencies = []

[project.optional-dependencies]
# The retrieval/LLM core: config, retriever, secrets, logging_config. Was the
# unconditional [project] dependencies block until the 2026-08-01 consolidation.
# Depended on by serve-core, ingest, and (transitively) api and eval.
pipeline = [
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.1",
    "langchain-openai>=1.1.14",
    "pinecone>=7.3.0",
    "pinecone-text>=0.11.0",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
]
# Shared serving stack: the agent runtime + Postgres-backed checkpointer with a
# connection pool. Imported by construct_agents.py. The `api` extra depends on
# it; `serve` does too for now, but Step 5 of the consolidation drops that once
# app.py stops importing src.response_generator.
serve-core = [
    "civilization-chatbot[pipeline]",
    "langgraph>=1.2.3",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
]
# Streamlit client. TEMPORARY serve-core reference: app.py still imports
# src.response_generator until Step 5, and dropping serve-core here would break
# the Streamlit surface for three steps. Step 5 deletes that line as its last
# edit, leaving streamlit + httpx + dotenv only. httpx is the API client
# transport (Timeout(connect=, read=) split, reusable Client with base_url).
serve = [
    "civilization-chatbot[serve-core]",
    "streamlit>=1.56.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]
# FastAPI client (the deployed API; step 3 wraps this in a container-image
# Lambda and adds Mangum). Deliberately excludes Streamlit.
api = [
    "civilization-chatbot[serve-core]",
    "fastapi>=0.139.2",
    "langchain-aws>=1.6.3",
    "mangum>=0.21.0",
    "uvicorn[standard]>=0.51.0",
]
# Scrape + embed + upsert to Pinecone. Runs locally on demand, never deployed.
# Needs an explicit `pipeline` reference now that the base block is empty: the
# ingester imports config/retriever/logging_config, which it used to get for free.
ingest = [
    "civilization-chatbot[pipeline]",
    "beautifulsoup4>=4.14.3",
    "langchain-community>=0.4.2",
    "requests>=2.33.1",
]
# Offline eval harness. Imports generate_response in-process (hence serve-core)
# and the raw anthropic SDK directly for the judges. Runs locally, never deployed.
eval = [
    "civilization-chatbot[serve-core]",
    "anthropic>=0.96.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort (drives organize-imports on save),
# UP pyupgrade, B bugbear, SIM simplify, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.format]
docstring-code-format = true

